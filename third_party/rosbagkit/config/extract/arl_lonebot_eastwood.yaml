bagfile_root: data/ARL_Jackal/rosbags
output_root: data/ARL_Jackal/extracted

topics:
  /lonebot/sensors/realsense/camera/color/image_raw/compressed:
    format: image
    outdir: image
    undistortion:
      enabled: true
      calib: data/ARL_Jackal/rosbags/lonebot_sensors_realsense_camera_color_intrinsics.yaml
  /lonebot/sensors/realsense/camera/depth/image_rect_raw:
    format: depth
    outdir: depth
  /lonebot/platform/odom:
    format: csv
    outpath: odom_platform.csv
  /lonebot/bev_patch_pf/odom:
    format: csv
    outpath: bev_patch_pf.csv
  /lonebot/sensors/ublox/fix:
    format: csv
    outpath: gps.csv

sync:
  enabled: true
  topics:
    - /lonebot/sensors/realsense/camera/color/image_raw/compressed
    - /lonebot/sensors/realsense/camera/depth/image_rect_raw
  threshold: 0.1

scenes:
  # Each bagfiles entry is relative to bagfile_root.
  eastwood_teleop-01_2026-02-19-11-50-35:
    bagfiles:
      - 2-19-eastwood/run_01_eastwood-park-teleop_2026-02-19-11-50-35
    start: 0
    end: -1
