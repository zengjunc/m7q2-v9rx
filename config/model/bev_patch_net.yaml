# 原作者模型配置：主干网络、BEV 网格及特征维度。
_target_: model.bev_patch_net.BEVPatchNet
name: "BEV-Patch-Net"

gnd_backbone_name: "convnext_tiny.dinov3_lvd1689m"
gnd_backbone_out_indices: [0, 1, 2, 3]

aer_backbone_name: "convnext_tiny.dinov3_lvd1689m"
aer_backbone_out_indices: [0, 1, 2]

bev_shape: [224, 224]

gnd_hidden_dim: 128
aer_hidden_dims: [64, 64, 32]
out_dim: 32
dropout: 0.1

# 复现新增：仅屏蔽无效深度，默认关闭；双目软聚合另由sequence.stereo_pooling控制。
mask_invalid_depth: false
